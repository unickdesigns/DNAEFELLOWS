<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>eFellows — over every mountain</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *{ box-sizing:border-box; margin:0; padding:0; }
  html{ scroll-behavior:auto; }
  body{ background:#0b0d0e; font-family:"Upton","Oswald",sans-serif; }
  canvas#gl{ position:fixed; inset:0; width:100vw; height:100vh; display:block; }
  .scrollspace{ height:800vh; }

  .finale{
    position:fixed; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:1.2vh; pointer-events:none;
  }
  .fline{
    font-size:clamp(36px,6.4vw,92px); font-weight:600; letter-spacing:-0.01em;
    line-height:1.08; color:#C8D1D6; white-space:nowrap; opacity:0;
  }
</style>
</head>
<body>

<canvas id="gl"></canvas>
<video id="src" src="footage.webm" muted playsinline preload="auto" style="display:none"></video>
<div class="scrollspace"></div>
<div class="finale">
  <div class="fline">Well architected.</div>
  <div class="fline">Exceptionally delivered.</div>
</div>

<script>
(async () => {
  const TAU = Math.PI * 2;
  const canvas = document.getElementById("gl");
  const ctx = canvas.getContext("2d");
  const video = document.getElementById("src");
  const qs = new URLSearchParams(location.search);
  const FORCE_P = qs.has("p") ? parseFloat(qs.get("p")) : null;

  const BLUE = [44, 96, 245], BG = "#0b0d0e";
  const lerp = (a,b,t) => a + (b-a)*t;
  const smooth = t => t*t*(3-2*t);
  const ss = (a,b,x) => { const t = Math.min(1, Math.max(0, (x-a)/(b-a))); return smooth(t); };

  /* ---------- the logo (the real SVG dots) ---------- */
  const LOGO = await fetch("dots.json").then(r => r.json());   // {x,y,r} in 863x641
  LOGO.forEach((d, i) => { d.seed = (i * 0.618) % 1; });

  /* ---------- video ready ---------- */
  await new Promise(res => {
    if (video.readyState >= 1) return res();
    video.addEventListener("loadedmetadata", res, { once: true });
  });
  const VDUR = video.duration;
  document.fonts.ready.then(() => { txtMap = null; });   // resample glyphs once real fonts land

  /* ---------- story ---------- */
  const P_IN    = [0.00, 0.05];
  const P_SCRUB = [0.00, 0.66];          // video 0 -> end across the scroll
  const P_MORPH = [0.66, 0.78];          // the sky collapses into the logo
  const P_TXT   = [0.83, 0.93];          // the logo dots fly out and draw the words
  const P_FOCUS = [0.895, 0.97];         // crisp type resolves as the dots settle
  const P_GONE  = [0.945, 0.995];        // the dots dissolve into the type

  /* ---------- sampling grid ---------- */
  const samp = document.createElement("canvas");
  const sctx = samp.getContext("2d", { willReadFrequently: true });
  let W = 0, Hh = 0, dpr = 1, COLS = 0, ROWS = 0, CELL = 0;
  let assign = null;                      // morph mapping: cellIndex -> logo dot target
  let txtMap = null;                      // per LOGO index: {x, y, line} glyph point
  function resize(){
    dpr = Math.min(2, window.devicePixelRatio || 1);
    W = innerWidth; Hh = innerHeight;
    canvas.width = W*dpr; canvas.height = Hh*dpr;
    COLS = Math.round(Math.min(96, Math.max(64, W/15)));
    CELL = W / COLS;
    ROWS = Math.ceil(Hh / CELL);
    samp.width = COLS; samp.height = ROWS;
    assign = null;                        // morph mapping depends on layout
    txtMap = null;
  }
  addEventListener("resize", resize); resize();

  /* ---------- text targets: sample the finale type, assign a letter point to every logo dot ---------- */
  const flines = [...document.querySelectorAll(".fline")];
  function buildTextTargets(){
    const pts = [];
    const cnv = document.createElement("canvas");
    for (let li = 0; li < flines.length; li++){
      const el = flines[li], rect = el.getBoundingClientRect(), cs = getComputedStyle(el);
      const w = Math.ceil(rect.width) + 8, h = Math.ceil(rect.height) + 8;
      cnv.width = w; cnv.height = h;
      const c2 = cnv.getContext("2d", { willReadFrequently: true });
      c2.font = `${cs.fontWeight} ${cs.fontSize}/${cs.lineHeight} ${cs.fontFamily}`;
      c2.textBaseline = "middle"; c2.fillStyle = "#fff";
      c2.fillText(el.textContent, 0, h/2);
      const step = Math.max(3, parseFloat(cs.fontSize) / 10);
      const data = c2.getImageData(0, 0, w, h).data;
      for (let y = 0; y < h; y += step) for (let x = 0; x < w; x += step){
        if (data[((y|0)*w + (x|0))*4 + 3] > 120)
          pts.push({ x: rect.left + x, y: rect.top + y, line: li });
      }
    }
    if (!pts.length) return;
    // reading-order sweep: logo dots left->right map onto letter points left->right
    pts.sort((a,b) => (a.line - b.line) || (a.x - b.x));
    const order = LOGO.map((d,i) => i).sort((a,b) => LOGO[a].x - LOGO[b].x);
    txtMap = new Array(LOGO.length);
    order.forEach((li, rank) => {
      const pt = pts[Math.floor(rank / order.length * pts.length)];
      txtMap[li] = pt;
    });
  }

  /* draw the current video frame into the grid — FLIPPED horizontally, cover-fit */
  function sampleFrame(){
    const vw = video.videoWidth || 898, vh = video.videoHeight || 506;
    const sAsp = COLS/ROWS, vAsp = vw/vh;
    let sx = 0, sy = 0, sw = vw, sh = vh;
    if (vAsp > sAsp){ sw = vh * sAsp; sx = (vw - sw)/2; }
    else            { sh = vw / sAsp; sy = (vh - sh)/2; }
    sctx.save();
    sctx.scale(-1, 1);                    // the horizontal flip
    sctx.drawImage(video, sx, sy, sw, sh, -COLS, 0, COLS, ROWS);
    sctx.restore();
    return sctx.getImageData(0, 0, COLS, ROWS).data;
  }

  /* ---------- morph assignment: which sky dots become the logo ---------- */
  function buildAssign(px){
    // logo placed centered, 50vh tall
    const s = (Hh * 0.5) / 641;
    const ox = W/2 - 431.5*s, oy = Hh*0.42 - 320.5*s;
    const bright = [];
    for (let cy = 0; cy < ROWS; cy++) for (let cx = 0; cx < COLS; cx++){
      const i = (cy*COLS + cx) * 4;
      if ((px[i] + px[i+1] + px[i+2]) / 765 > 0.22) bright.push(cy*COLS + cx);
    }
    assign = new Map();
    const claimed = new Set();
    LOGO.forEach((d, li) => {
      const tx = ox + d.x*s, ty = oy + d.y*s;
      let best = -1, bd = 1e18;
      for (const ci of bright){
        if (claimed.has(ci)) continue;
        const bx = (ci % COLS + 0.5)*CELL, by = (Math.floor(ci/COLS) + 0.5)*CELL;
        const dd = (bx-tx)*(bx-tx) + (by-ty)*(by-ty);
        if (dd < bd){ bd = dd; best = ci; }
      }
      if (best >= 0){ claimed.add(best); assign.set(best, { tx, ty, tr: d.r*s, seed: d.seed, li }); }
    });
  }

  /* ---------- scrub ---------- */
  let pS = FORCE_P ?? 0;
  function wantTime(p){ return Math.min(VDUR - 0.08, ss(P_SCRUB[0], P_SCRUB[1], p) * (VDUR - 0.35) + 0.2); }
  let lastSeek = -1;
  function scrub(p){
    const target = wantTime(Math.min(p, P_MORPH[0]));   // freeze on the last frame during the morph
    if (Math.abs(target - lastSeek) > 0.04 && video.seekable.length){
      lastSeek = target;
      video.currentTime = target;
    }
  }

  function draw(time){
    const p = pS;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = BG; ctx.fillRect(0, 0, W, Hh);

    const inA = Math.max(ss(P_IN[0], P_IN[1], p), Math.min(1, Math.max(0, (time - 300) / 1300)));
    const m = ss(P_MORPH[0], P_MORPH[1], p);
    const tx2 = ss(P_TXT[0], P_TXT[1], p);            // logo -> letters
    const gone = ss(P_GONE[0], P_GONE[1], p);         // letters -> nothing (the type takes over)
    const px = sampleFrame();
    if (m > 0 && !assign) buildAssign(px);
    if (m <= 0) assign = null;
    if (tx2 > 0 && !txtMap) buildTextTargets();

    const rMax = CELL * 0.5;
    const GREY = [200, 209, 214];
    for (let cy = 0; cy < ROWS; cy++){
      for (let cx = 0; cx < COLS; cx++){
        const ci = cy*COLS + cx;
        const i = ci * 4;
        const R = px[i], G = px[i+1], B = px[i+2];
        const lum = (R*0.299 + G*0.587 + B*0.114) / 255;
        const tgt = m > 0 && assign ? assign.get(ci) : undefined;

        let r = lum < 0.10 ? 0 : rMax * Math.pow(lum, 1.8) * 0.84;
        let x = (cx + 0.5) * CELL, y = (cy + 0.5) * CELL;
        let col = `rgb(${R},${G},${B})`, alpha = inA;

        if (tgt){
          // sky dot -> logo dot
          const e = smooth(ss(tgt.seed*0.25, tgt.seed*0.25 + 0.75, m));
          x = lerp(x, tgt.tx, e); y = lerp(y, tgt.ty, e);
          r = Math.max(lerp(r, tgt.tr, e), 0.8);
          let cr = lerp(R, BLUE[0], e), cg = lerp(G, BLUE[1], e), cb = lerp(B, BLUE[2], e);

          // logo dot -> a point of the headline glyphs
          const tp = txtMap ? txtMap[tgt.li] : null;
          if (tp && tx2 > 0){
            const e2 = smooth(ss(tgt.seed*0.4 + tp.line*0.18, tgt.seed*0.4 + tp.line*0.18 + 0.42, tx2));
            x = lerp(x, tp.x, e2); y = lerp(y, tp.y, e2);
            r = lerp(r, Math.max(1.6, CELL*0.16), e2);
            cr = lerp(cr, GREY[0], e2); cg = lerp(cg, GREY[1], e2); cb = lerp(cb, GREY[2], e2);
            if (gone > 0){
              const g2 = ss(tgt.seed*0.5, tgt.seed*0.5 + 0.5, gone);
              r *= (1 - g2);                            // removed in the end
            }
          }
          col = `rgb(${Math.round(cr)},${Math.round(cg)},${Math.round(cb)})`;
          alpha = 1;
        } else if (m > 0){
          r *= Math.max(0, 1 - m*1.35);                 // the rest of the frame dissolves
        }
        if (r < 0.3 || alpha <= 0.01) continue;
        ctx.globalAlpha = alpha;
        ctx.fillStyle = col;
        ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill();
      }
    }
    ctx.globalAlpha = 1;

    /* crisp type resolves out of the dots — DNA focus-pull */
    flines.forEach((el, li) => {
      const f = ss(P_FOCUS[0] + li*0.022, P_FOCUS[1] + li*0.022, p);
      el.style.opacity = f;
      el.style.filter = `blur(${(1-f)*9}px)`;
    });
  }

  /* ---------- scroll + loop ---------- */
  function targetP(){
    if (FORCE_P !== null) return FORCE_P;
    const max = document.documentElement.scrollHeight - innerHeight;
    return max > 0 ? Math.min(1, Math.max(0, scrollY / max)) : 0;
  }
  function loop(time){
    const tp = targetP();
    pS += (tp - pS) * 0.10;
    if (Math.abs(tp - pS) < 0.0004) pS = tp;
    scrub(pS);
    draw(time);
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
