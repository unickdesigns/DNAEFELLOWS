<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>eFellows — over every mountain</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *{ box-sizing:border-box; margin:0; padding:0; }
  html{ scroll-behavior:auto; }
  body{ background:#0b0d0e; font-family:"Upton","Oswald",sans-serif; }
  canvas#gl{ position:fixed; inset:0; width:100vw; height:100vh; display:block; }
  .scrollspace{ height:800vh; }

  .finale{
    position:fixed; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:1.2vh; pointer-events:none;
  }
  .fline{
    font-size:clamp(36px,6.4vw,92px); font-weight:600; letter-spacing:-0.01em;
    line-height:1.08; color:#C8D1D6; white-space:nowrap; opacity:0;
  }

  /* ---- tuning panel (press H) ---- */
  .panel{
    position:fixed; top:14px; right:14px; z-index:50; width:240px;
    background:rgba(13,15,17,.94); border:1px solid #262b31; border-radius:12px;
    padding:14px 16px; font-family:-apple-system,system-ui,sans-serif; font-size:12px;
    color:#cdd4dd; display:none; backdrop-filter:blur(8px);
  }
  .panel.open{ display:block; }
  .panel h3{ font-size:11px; text-transform:uppercase; letter-spacing:.1em; color:#77828e; margin-bottom:10px; font-weight:600; }
  .panel .row{ margin-bottom:10px; }
  .panel label{ display:flex; justify-content:space-between; margin-bottom:4px; }
  .panel label span{ color:#77828e; font-variant-numeric:tabular-nums; }
  .panel input[type=range]{ -webkit-appearance:none; width:100%; height:2px; background:#2a3038; outline:none; }
  .panel input[type=range]::-webkit-slider-thumb{ -webkit-appearance:none; width:12px; height:12px; border-radius:50%; background:#e7ecf2; cursor:pointer; }
  .panel button{
    font:inherit; width:100%; margin-top:4px; padding:7px 0; color:#cdd4dd;
    background:#1c2127; border:1px solid #2a3038; border-radius:8px; cursor:pointer;
  }
  .panel button:hover{ background:#242a31; }
  .panel .hint{ margin-top:8px; color:#59636e; font-size:10.5px; }
</style>
</head>
<body>

<canvas id="gl"></canvas>
<video id="src" src="footage.webm" muted playsinline preload="auto" style="display:none"></video>
<div class="scrollspace"></div>
<div class="finale">
  <div class="fline">Well architected.</div>
  <div class="fline">Exceptionally delivered.</div>
</div>

<div class="panel" id="panel">
  <h3>Dot screen</h3>
  <div class="row"><label>Density (cols) <span id="vCols"></span></label><input type="range" id="cCols" min="36" max="150" step="2"></div>
  <div class="row"><label>Dot size <span id="vSize"></span></label><input type="range" id="cSize" min="0.3" max="1.6" step="0.02"></div>
  <div class="row"><label>Contrast (gamma) <span id="vGamma"></span></label><input type="range" id="cGamma" min="0.8" max="4" step="0.05"></div>
  <div class="row"><label>Threshold <span id="vThr"></span></label><input type="range" id="cThr" min="0" max="0.4" step="0.01"></div>
  <div class="row"><label>Text dot size <span id="vTxt"></span></label><input type="range" id="cTxt" min="1" max="6" step="0.1"></div>
  <button id="copyCfg">⧉ Copy settings</button>
  <div class="hint">H toggles this panel · ?p=0.9 pins scroll</div>
</div>

<script>
(async () => {
  const TAU = Math.PI * 2;
  const canvas = document.getElementById("gl");
  const ctx = canvas.getContext("2d");
  const video = document.getElementById("src");
  const qs = new URLSearchParams(location.search);
  const FORCE_P = qs.has("p") ? parseFloat(qs.get("p")) : null;

  const BG = "#0b0d0e";
  const lerp = (a,b,t) => a + (b-a)*t;
  const smooth = t => t*t*(3-2*t);
  const ss = (a,b,x) => { const t = Math.min(1, Math.max(0, (x-a)/(b-a))); return smooth(t); };

  /* ---------- tunables (press H for the panel) ---------- */
  const CFG = {
    cols: 72,          // grid density (dots across the width)
    dotScale: 0.80,    // overall dot size
    gamma: 2.1,        // luminance -> size contrast (higher = sparser highlights)
    threshold: 0.14,   // luminance below this draws nothing
    textDot: 2.6,      // px radius of the letter dots
  };

  /* ---------- video ready ---------- */
  await new Promise(res => {
    if (video.readyState >= 1) return res();
    video.addEventListener("loadedmetadata", res, { once: true });
  });
  const VDUR = video.duration;

  /* ---------- story ---------- */
  const P_IN    = [0.00, 0.05];
  const P_SCRUB = [0.00, 0.72];          // the film, scrubbed by scroll
  const P_TXT   = [0.74, 0.88];          // the people's dots fly out and draw the words
  const P_FOCUS = [0.85, 0.95];          // crisp type resolves as the dots settle
  const P_GONE  = [0.92, 0.99];          // the dots dissolve into the type

  /* ---------- sampling grid ---------- */
  const samp = document.createElement("canvas");
  const sctx = samp.getContext("2d", { willReadFrequently: true });
  let W = 0, Hh = 0, dpr = 1, COLS = 0, ROWS = 0, CELL = 0;
  let txtAssign = null;                   // cellIndex -> {x, y, line, seed}
  function resize(){
    dpr = Math.min(2, window.devicePixelRatio || 1);
    W = innerWidth; Hh = innerHeight;
    canvas.width = W*dpr; canvas.height = Hh*dpr;
    COLS = Math.max(24, Math.min(CFG.cols, Math.round(W/6)));
    CELL = W / COLS;
    ROWS = Math.ceil(Hh / CELL);
    samp.width = COLS; samp.height = ROWS;
    txtAssign = null;
  }
  addEventListener("resize", resize); resize();

  /* draw the current video frame into the grid — FLIPPED horizontally, cover-fit */
  function sampleFrame(){
    const vw = video.videoWidth || 898, vh = video.videoHeight || 506;
    const sAsp = COLS/ROWS, vAsp = vw/vh;
    let sx = 0, sy = 0, sw = vw, sh = vh;
    if (vAsp > sAsp){ sw = vh * sAsp; sx = (vw - sw)/2; }
    else            { sh = vw / sAsp; sy = (vh - sh)/2; }
    sctx.save();
    sctx.scale(-1, 1);                    // the horizontal flip
    sctx.drawImage(video, sx, sy, sw, sh, -COLS, 0, COLS, ROWS);
    sctx.restore();
    return sctx.getImageData(0, 0, COLS, ROWS).data;
  }

  /* ---------- the words, drawn from the people ----------
     sample the finale glyphs, then give each glyph point the nearest bright
     cell of the frozen last frame — those dots fly out and write the line. */
  const flines = [...document.querySelectorAll(".fline")];
  document.fonts.ready.then(() => { txtAssign = null; });
  function buildTextAssign(px){
    const pts = [];
    const cnv = document.createElement("canvas");
    for (let li = 0; li < flines.length; li++){
      const el = flines[li], rect = el.getBoundingClientRect(), cs = getComputedStyle(el);
      const w = Math.ceil(rect.width) + 8, h = Math.ceil(rect.height) + 8;
      cnv.width = w; cnv.height = h;
      const c2 = cnv.getContext("2d", { willReadFrequently: true });
      c2.font = `${cs.fontWeight} ${cs.fontSize}/${cs.lineHeight} ${cs.fontFamily}`;
      c2.textBaseline = "middle"; c2.fillStyle = "#fff";
      c2.fillText(el.textContent, 0, h/2);
      const step = Math.max(3, parseFloat(cs.fontSize) / 10);
      const data = c2.getImageData(0, 0, w, h).data;
      for (let y = 0; y < h; y += step) for (let x = 0; x < w; x += step){
        if (data[((y|0)*w + (x|0))*4 + 3] > 120)
          pts.push({ x: rect.left + x, y: rect.top + y, line: li, seed: ((x*7 + y*13) % 97) / 97 });
      }
    }
    if (!pts.length) return;
    // bright cells of the current frame = the lit sky around the people
    const bright = [];
    for (let ci = 0; ci < COLS*ROWS; ci++){
      const i = ci*4;
      if ((px[i]*0.299 + px[i+1]*0.587 + px[i+2]*0.114) / 255 > Math.max(0.2, CFG.threshold + 0.04)) bright.push(ci);
    }
    txtAssign = new Map();
    const claimed = new Set();
    for (const pt of pts){
      let best = -1, bd = 1e18;
      for (const ci of bright){
        if (claimed.has(ci)) continue;
        const bx = (ci % COLS + 0.5)*CELL, by = (Math.floor(ci/COLS) + 0.5)*CELL;
        const dd = (bx-pt.x)*(bx-pt.x) + (by-pt.y)*(by-pt.y);
        if (dd < bd){ bd = dd; best = ci; }
      }
      if (best < 0) break;
      claimed.add(best);
      txtAssign.set(best, pt);
    }
  }

  /* ---------- scrub ---------- */
  let pS = FORCE_P ?? 0;
  function wantTime(p){ return Math.min(VDUR - 0.08, ss(P_SCRUB[0], P_SCRUB[1], p) * (VDUR - 0.35) + 0.2); }
  let lastSeek = -1;
  function scrub(p){
    const target = wantTime(Math.min(p, P_TXT[0]));    // hold the last frame while the words form
    if (Math.abs(target - lastSeek) > 0.04 && video.seekable.length){
      lastSeek = target;
      video.currentTime = target;
    }
  }

  function draw(time){
    const p = pS;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = BG; ctx.fillRect(0, 0, W, Hh);

    const inA = Math.max(ss(P_IN[0], P_IN[1], p), Math.min(1, Math.max(0, (time - 300) / 1300)));
    const tx2 = ss(P_TXT[0], P_TXT[1], p);
    const gone = ss(P_GONE[0], P_GONE[1], p);
    const px = sampleFrame();
    if (tx2 > 0 && !txtAssign) buildTextAssign(px);
    if (tx2 <= 0) txtAssign = null;

    const rMax = CELL * 0.5;
    const GREY = [200, 209, 214];
    for (let cy = 0; cy < ROWS; cy++){
      for (let cx = 0; cx < COLS; cx++){
        const ci = cy*COLS + cx;
        const i = ci * 4;
        const R = px[i], G = px[i+1], B = px[i+2];
        const lum = (R*0.299 + G*0.587 + B*0.114) / 255;

        let r = lum < CFG.threshold ? 0 : rMax * Math.pow(lum, CFG.gamma) * CFG.dotScale;
        let x = (cx + 0.5) * CELL, y = (cy + 0.5) * CELL;
        let col = `rgb(${R},${G},${B})`, alpha = inA;

        const tgt = tx2 > 0 && txtAssign ? txtAssign.get(ci) : undefined;
        if (tgt){
          // a dot of the scene becomes a point of the words
          const e = smooth(ss(tgt.seed*0.4 + tgt.line*0.16, tgt.seed*0.4 + tgt.line*0.16 + 0.44, tx2));
          x = lerp(x, tgt.x, e); y = lerp(y, tgt.y, e);
          r = lerp(Math.max(r, 1.2), CFG.textDot, e);
          col = `rgb(${Math.round(lerp(R, GREY[0], e))},${Math.round(lerp(G, GREY[1], e))},${Math.round(lerp(B, GREY[2], e))})`;
          alpha = 1;
          if (gone > 0) r *= (1 - ss(tgt.seed*0.5, tgt.seed*0.5 + 0.5, gone));   // removed in the end
        } else if (tx2 > 0){
          r *= Math.max(0, 1 - tx2*1.5);                // the rest of the scene dissolves
        }
        if (r < 0.3 || alpha <= 0.01) continue;
        ctx.globalAlpha = alpha;
        ctx.fillStyle = col;
        ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill();
      }
    }
    ctx.globalAlpha = 1;

    /* crisp type resolves out of the dots — DNA focus-pull */
    flines.forEach((el, li) => {
      const f = ss(P_FOCUS[0] + li*0.022, P_FOCUS[1] + li*0.022, p);
      el.style.opacity = f;
      el.style.filter = `blur(${(1-f)*9}px)`;
    });
  }

  /* ---------- tuning panel ---------- */
  const panel = document.getElementById("panel");
  addEventListener("keydown", e => { if (e.key === "h" || e.key === "H") panel.classList.toggle("open"); });
  const wire = (id, valId, key, fmt, after) => {
    const el = document.getElementById(id), lab = document.getElementById(valId);
    el.value = CFG[key]; lab.textContent = fmt(CFG[key]);
    el.addEventListener("input", () => {
      CFG[key] = parseFloat(el.value);
      lab.textContent = fmt(CFG[key]);
      if (after) after();
      txtAssign = null;
    });
  };
  wire("cCols", "vCols", "cols", v => v, resize);
  wire("cSize", "vSize", "dotScale", v => Math.round(v*100) + "%");
  wire("cGamma", "vGamma", "gamma", v => (+v).toFixed(2));
  wire("cThr", "vThr", "threshold", v => (+v).toFixed(2));
  wire("cTxt", "vTxt", "textDot", v => (+v).toFixed(1) + "px");
  document.getElementById("copyCfg").addEventListener("click", async () => {
    try { await navigator.clipboard.writeText(JSON.stringify(CFG, null, 2)); } catch(e){}
  });

  /* ---------- scroll + loop ---------- */
  function targetP(){
    if (FORCE_P !== null) return FORCE_P;
    const max = document.documentElement.scrollHeight - innerHeight;
    return max > 0 ? Math.min(1, Math.max(0, scrollY / max)) : 0;
  }
  function loop(time){
    const tp = targetP();
    pS += (tp - pS) * 0.10;
    if (Math.abs(tp - pS) < 0.0004) pS = tp;
    scrub(pS);
    draw(time);
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
