<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>eFellows — Twenty-two years, stacked</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#15191C; --ink:#C8D1D6; --rule:rgba(200,209,214,.10);
    --c04:#E2692F; --c06:#2C60F5; --c18:#5AE082; --c25:#A16FFF;
    --sans:"Upton","Oswald",sans-serif;
    --mono:"Proto Mono","JetBrains Mono",ui-monospace,monospace;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html{ scroll-behavior:auto; }
  body{ background:var(--bg); color:var(--ink); font-family:var(--sans); -webkit-font-smoothing:antialiased; }

  /* ---- page scaffolding (placeholder sections around the element) ---- */
  .filler{ height:60vh; display:flex; align-items:flex-end; padding:0 clamp(24px,5vw,84px) 48px;
    font-family:var(--mono); font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:rgba(200,209,214,.35); }

  /* ---- the element ---- */
  .tracks-scroll{ position:relative; height:320vh; }            /* scroll runway (full mode) */
  .tracks-sticky{ position:sticky; top:0; height:100vh; display:flex; align-items:center; }
  .tracks{ width:min(1273px, 100% - 2*clamp(24px,5vw,84px)); margin:0 auto; }
  .tracks .rule{ height:1px; background:var(--rule); margin-bottom:48px; }
  .tracks header{ display:grid; grid-template-columns:1fr 1fr; gap:32px; align-items:start; margin-bottom:56px; }
  .tracks h2{ font-size:48px; font-weight:600; line-height:.9; letter-spacing:-0.01em; max-width:260px; }
  .tracks .lede{ font-size:32px; font-weight:600; line-height:1.1; max-width:360px; padding-left:clamp(0px,4vw,60px); }

  .graph{ position:relative; width:100%; }
  .graph svg{ display:block; width:100%; height:auto; overflow:visible; }
  .graph text{ font-family:var(--mono); font-size:14px; letter-spacing:.04em; text-transform:uppercase; }
  .graph .lbl, .graph .yr{ opacity:0; transition:opacity .35s ease, transform .6s cubic-bezier(.2,.7,.2,1); transform:translateY(6px); }
  .graph .lbl.on, .graph .yr.on{ opacity:1; transform:translateY(0); }
  .graph .lbl.hi{ font-size:16px; font-weight:500; letter-spacing:.05em; }
  .graph .end{ font-size:11px; letter-spacing:.1em; }
  .graph .glow{ filter:drop-shadow(0 0 6px rgba(161,111,255,.55)); }

  /* condensed, non-interactive (Home) */
  body.home .tracks-scroll{ height:auto; }
  body.home .tracks-sticky{ position:static; height:auto; padding:64px 0; }
  body.home .tracks header{ margin-bottom:32px; }
  body.home .tracks h2{ font-size:36px; }
  body.home .tracks .lede{ font-size:22px; }
  body.home .filler{ height:40vh; }

  @media (max-width:820px){
    .tracks header{ grid-template-columns:1fr; gap:16px; }
    .tracks h2{ font-size:36px; }
    .tracks .lede{ font-size:22px; padding-left:0; }
    .graph text{ font-size:11px; }
    .graph .lbl.hi{ font-size:12px; }
  }
</style>
</head>
<body>

<div class="filler">Expertise hub · scroll</div>

<section class="tracks-scroll" id="scrollzone">
  <div class="tracks-sticky">
    <div class="tracks">
      <div class="rule"></div>
      <header>
        <h2>Twenty-two years, stacked</h2>
        <p class="lede">Four tracks, opened along the way. Constantly evolving.</p>
      </header>
      <div class="graph" id="graph"></div>
    </div>
  </div>
</section>

<div class="filler">next section</div>

<script>
(() => {
  const qs = new URLSearchParams(location.search);
  const HOME = qs.has("home");                    // ?home → condensed, non-interactive
  if (HOME) document.body.classList.add("home");
  const FORCE = qs.has("p") ? parseFloat(qs.get("p")) : null;

  /* ---------- data ---------- */
  const TRACKS = [
    { yr:"’04", x:0.00, name:"Infrastructure",                      color:"#E2692F" },
    { yr:"’06", x:0.24, name:"Defensive Cybersecurity",             color:"#2C60F5" },
    { yr:"’18", x:0.45, name:"DevOps, Cloud & Platform Eng",        color:"#5AE082" },
    { yr:"’25", x:0.67, name:"Agentic Engineering & AI/ML Platforms", color:"#A16FFF", hi:true },
  ];

  const graph = document.getElementById("graph");
  const NS = "http://www.w3.org/2000/svg";
  const el = (n, a={}) => { const e = document.createElementNS(NS, n); for (const k in a) e.setAttribute(k, a[k]); return e; };

  /* ---------- build ---------- */
  let W = 0, svg, clipRect, labels = [], years = [], H = 0;
  const LANE = HOME ? 42 : 68, RISE = HOME ? 100 : 150, TOP_PAD = 44, BOTTOM_PAD = 56;

  function build(){
    W = graph.clientWidth;
    H = TOP_PAD + LANE * (TRACKS.length - 1) + BOTTOM_PAD;
    graph.innerHTML = "";
    svg = el("svg", { viewBox:`0 0 ${W} ${H}`, width:W, height:H });

    // clip: the time cursor sweeps left -> right revealing everything
    const defs = el("defs");
    const clip = el("clipPath", { id:"sweep" });
    clipRect = el("rect", { x:-4, y:-40, width:0, height:H+80 });
    clip.appendChild(clipRect); defs.appendChild(clip); svg.appendChild(defs);
    const g = el("g", { "clip-path":"url(#sweep)" });
    svg.appendChild(g);

    const base = TOP_PAD + LANE * (TRACKS.length - 1);     // bottom lane y
    labels = []; years = [];

    TRACKS.forEach((t, i) => {
      const x0 = t.x * W;
      const yLane = base - LANE * i;
      const sw = t.hi ? 4.5 : 2.5;
      let d;
      if (i === 0) d = `M ${x0} ${yLane} H ${W}`;
      else {
        // rises out of the lane below with one smooth, seamless S-curve
        const yFrom = yLane + LANE;
        d = `M ${x0} ${yFrom} C ${x0 + RISE*0.5} ${yFrom}, ${x0 + RISE*0.5} ${yLane}, ${x0 + RISE} ${yLane} H ${W}`;
      }
      g.appendChild(el("path", { d, fill:"none", stroke:t.color, "stroke-width":sw,
        "stroke-linecap":"round", ...(t.hi ? { class:"glow" } : {}) }));

      // track label: starts at the inception year (like the design), above its lane
      const lbl = el("text", { x:x0 + 2, y:yLane - (t.hi ? 22 : 10), fill:t.color, class:"lbl" + (t.hi ? " hi" : "") });
      lbl.textContent = t.name; lbl.dataset.at = x0 + 10;
      svg.appendChild(lbl); labels.push(lbl);
      lbl.dataset.guard = "1";

      // year marker under the baseline
      const yr = el("text", { x:x0, y:base + 30, fill:t.color, class:"yr" });
      yr.textContent = t.yr; yr.dataset.at = x0;
      svg.appendChild(yr); years.push(yr);
    });
    graph.appendChild(svg);
    // overflow guard — measured after attach (detached SVG text measures as 0)
    for (const lbl of labels){
      if (!lbl.dataset.guard) continue;
      const x = parseFloat(lbl.getAttribute("x"));
      const len = Math.max(lbl.getComputedTextLength(), lbl.getBBox().width) + 6;
      if (x + len > W){ lbl.setAttribute("x", W); lbl.setAttribute("text-anchor", "end"); }
    }
    apply(cur);
  }

  /* ---------- drive ---------- */
  let cur = FORCE ?? 0, target = 0;
  function apply(p){
    const x = p * W;
    clipRect.setAttribute("width", Math.max(0, x + 4));
    for (const t of [...labels, ...years]) t.classList.toggle("on", x >= parseFloat(t.dataset.at));
  }
  function targetP(){
    if (FORCE !== null) return FORCE;
    if (HOME) return homeP;
    const z = document.getElementById("scrollzone");
    const r = z.getBoundingClientRect();
    const runway = z.offsetHeight - innerHeight;
    return Math.min(1, Math.max(0, -r.top / runway));
  }
  // Home: a single eased sweep once the element is in view, then it holds
  let homeP = 0;
  if (HOME){
    const io = new IntersectionObserver(es => {
      if (!es[0].isIntersecting) return;
      io.disconnect();
      const t0 = performance.now(), D = 3200;
      (function step(now){
        const t = Math.min(1, (now - t0) / D);
        homeP = 1 - Math.pow(1 - t, 3);               // ease-out
        if (t < 1) requestAnimationFrame(step);
      })(t0);
    }, { threshold:0.35 });
    io.observe(graph);
  }

  function loop(){
    if (graph.clientWidth !== W && graph.clientWidth > 0) build();   // self-heal if built at 0 width
    target = targetP();
    cur += (target - cur) * 0.09;                     // smooth follow
    if (Math.abs(target - cur) < 0.0005) cur = target;
    apply(cur);
    requestAnimationFrame(loop);
  }

  build();
  addEventListener("resize", build);
  document.fonts.ready.then(build);
  document.fonts.addEventListener("loadingdone", build);   // re-measure labels once the mono font lands
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
