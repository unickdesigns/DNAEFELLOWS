<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>eFellows — Twenty-two years, stacked</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#15191C; --ink:#C8D1D6; --rule:rgba(200,209,214,.10);
    --sans:"Upton","Oswald",sans-serif;
    --mono:"Proto Mono","JetBrains Mono",ui-monospace,monospace;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html{ scroll-behavior:auto; }
  body{ background:var(--bg); color:var(--ink); font-family:var(--sans); -webkit-font-smoothing:antialiased; }

  .filler{ height:60vh; display:flex; align-items:flex-end; padding:0 clamp(24px,5vw,84px) 48px;
    font-family:var(--mono); font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:rgba(200,209,214,.35); }

  .tracks-scroll{ position:relative; height:420vh; }
  .tracks-sticky{ position:sticky; top:0; height:100vh; display:flex; align-items:center; overflow:hidden; }
  .tracks{ width:min(1273px, 100% - 2*clamp(24px,5vw,84px)); margin:0 auto; }

  /* header floats over the scene and only resolves at the wide shot */
  .tracks header{ display:block; margin-bottom:56px; opacity:0; }
  .tracks .rule{ height:1px; background:var(--rule); margin-bottom:48px; opacity:0; }
  .tracks h2{ font-size:48px; font-weight:600; line-height:.9; letter-spacing:-0.01em; max-width:260px; }
  .tracks .lede{ font-size:22px; font-weight:600; line-height:1.2; max-width:300px; margin-top:18px; }

  .graph{ position:relative; width:100%; }
  .graph svg{ display:block; width:100%; height:auto; overflow:visible; }
  .graph text{ font-family:var(--mono); font-size:14px; letter-spacing:.04em; text-transform:uppercase; }
  .graph .lbl, .graph .yr{ opacity:0; transition:opacity .5s ease, transform .7s cubic-bezier(.2,.7,.2,1); transform:translateY(6px); }
  .graph .lbl.on, .graph .yr.on{ opacity:1; transform:translateY(0); }
  .graph .lbl.hi{ font-size:16px; font-weight:500; letter-spacing:.05em; }
  .graph .tick{ font-size:24px; font-weight:500; letter-spacing:.06em; }
  .graph .glow{ filter:drop-shadow(0 0 6px rgba(161,111,255,.55)); }

  body.home .tracks-scroll{ height:auto; }
  body.home .tracks-sticky{ position:static; height:auto; padding:64px 0; overflow:visible; }
  body.home .tracks header{ margin-bottom:32px; }
  body.home .tracks h2{ font-size:36px; }
  body.home .tracks .lede{ font-size:22px; }
  body.home .filler{ height:40vh; }
  body.bare .filler{ display:none; }

  @media (max-width:820px){
    .tracks header{ grid-template-columns:1fr; gap:16px; }
    .tracks h2{ font-size:36px; }
    .tracks .lede{ font-size:22px; padding-left:0; }
    .graph text{ font-size:11px; }
    .graph .lbl.hi{ font-size:12px; }
  }
</style>
</head>
<body>

<div class="filler">Expertise hub · scroll</div>

<section class="tracks-scroll" id="scrollzone">
  <div class="tracks-sticky">
    <div class="tracks">
      <div class="rule" id="rule"></div>
      <header id="hdr">
        <h2>Twenty-two years, stacked</h2>
        <p class="lede">Four tracks, opened along the way. Constantly evolving.</p>
      </header>
      <div class="graph" id="graph"></div>
    </div>
  </div>
</section>

<div class="filler">next section</div>

<script>
(() => {
  const qs = new URLSearchParams(location.search);
  const HOME = qs.has("home");
  if (HOME) document.body.classList.add("home");
  if (qs.has("bare")) document.body.classList.add("bare");
  const FORCE = qs.has("p") ? parseFloat(qs.get("p")) : null;

  /* ---------- data: linear time axis 2004..2028 ---------- */
  const T0 = 2004, T1 = 2028;
  const tx = y => (y - T0) / (T1 - T0);
  const TRACKS = [
    { yr:"’04", x:tx(2004), name:"Infrastructure",                        color:"#E2692F" },
    { yr:"’06", x:tx(2006), name:"Defensive Cybersecurity",               color:"#2C60F5" },
    { yr:"’18", x:tx(2018), name:"DevOps, Cloud & Platform Eng",          color:"#5AE082" },
    { yr:"’25", x:tx(2025), name:"Agentic Engineering & AI/ML Platforms", color:"#A16FFF", hi:true },
  ];

  const graph = document.getElementById("graph");
  const hdr = document.getElementById("hdr");
  const rule = document.getElementById("rule");
  const NS = "http://www.w3.org/2000/svg";
  const el = (n, a={}) => { const e = document.createElementNS(NS, n); for (const k in a) e.setAttribute(k, a[k]); return e; };
  const lerp = (a,b,t) => a + (b-a)*t;
  const clamp = (v,a,b) => v < a ? a : v > b ? b : v;
  const smooth = t => t*t*(3-2*t);
  const ss = (a,b,x) => smooth(clamp((x-a)/(b-a), 0, 1));

  /* ---------- build ---------- */
  let W = 0, H = 0, svg, cam, parts = [], texts = [], tickG = null, tickEl = null;
  const LANE = HOME ? 42 : 68, RISE = HOME ? 100 : 150, TOP_PAD = 44, BOTTOM_PAD = 56;
  const GAP = 90;                                 // the chase: each newer line trails by this

  function build(){
    W = graph.clientWidth;
    H = TOP_PAD + LANE * (TRACKS.length - 1) + BOTTOM_PAD;
    graph.innerHTML = "";
    svg = el("svg", { viewBox:`0 0 ${W} ${H}`, width:W, height:H });
    const defs = el("defs"); svg.appendChild(defs);
    cam = el("g"); svg.appendChild(cam);

    const base = TOP_PAD + LANE * (TRACKS.length - 1);
    parts = []; texts = [];

    TRACKS.forEach((t, i) => {
      const x0 = t.x * W;
      const yLane = base - LANE * i;
      const sw = 3;
      const rise = i === 0 ? 0 : Math.min(RISE, (W - x0) * 0.5);
      const yFrom = yLane + LANE;
      const d = i === 0
        ? `M ${x0} ${yLane} H ${W}`
        : `M ${x0} ${yFrom} C ${x0 + rise*0.5} ${yFrom}, ${x0 + rise*0.5} ${yLane}, ${x0 + rise} ${yLane} H ${W}`;

      let stroke = t.color;
      if (i > 0){
        const lg = el("linearGradient", { id:`grad${i}`, gradientUnits:"userSpaceOnUse", x1:x0, y1:0, x2:x0 + rise*1.7, y2:0 });
        lg.append(el("stop", { offset:"0", "stop-color":TRACKS[i-1].color }),
                  el("stop", { offset:"1", "stop-color":t.color }));
        defs.appendChild(lg);
        stroke = `url(#grad${i})`;
      }
      const clip = el("clipPath", { id:`clip${i}` });
      const clipRect = el("rect", { x:x0, y:-60, width:0, height:H + 120 });
      clip.appendChild(clipRect); defs.appendChild(clip);
      const path = el("path", { d, fill:"none", stroke, "stroke-width":sw,
        "stroke-linecap":"round", "clip-path":`url(#clip${i})` });
      cam.appendChild(path);

      // fade-out tail past the right edge, shown once the line arrives there
      const fg = el("linearGradient", { id:`fade${i}`, gradientUnits:"userSpaceOnUse", x1:W, y1:0, x2:W*1.28, y2:0 });
      fg.append(el("stop", { offset:"0", "stop-color":t.color, "stop-opacity":"1" }),
                el("stop", { offset:"1", "stop-color":t.color, "stop-opacity":"0" }));
      defs.appendChild(fg);
      const tailEl = el("path", { d:`M ${W} ${yLane} H ${W*1.28}`, fill:"none",
        stroke:`url(#fade${i})`, "stroke-width":sw, opacity:0 });
      cam.appendChild(tailEl);

      // labels & years live at fixed UI size: counter-scaled against the camera
      const mkText = (cls, str, ax, ay) => {
        const gg = el("g");
        const txt = el("text", { fill:t.color, class:cls });
        txt.textContent = str;
        gg.appendChild(txt); cam.appendChild(gg);
        texts.push({ el:txt, g:gg, ax, ay, track:i });
      };
      mkText("lbl", t.name, x0, base + 56);
      mkText("yr", t.yr, x0, base + 34);

      parts.push({ path, tailEl, clipRect, x0, rise, yLane, yFrom });
    });

    tickG = el("g");
    tickEl = el("text", { class:"tick", fill:TRACKS[0].color });
    tickG.appendChild(tickEl); cam.appendChild(tickG);
    graph.appendChild(svg);
    for (const t of texts)
      t.wpx = Math.max(t.el.getComputedTextLength(), t.el.getBBox().width) + 6;
    // legend layout, two passes: make room right-to-left, resolve overlaps left-to-right.
    // if the row can never fit, wrap to a vertical list instead.
    const names = texts.filter((t,k) => k % 2 === 0);
    const needed = names.reduce((a,t) => a + t.wpx, 0) + 26*3;
    const base2 = TOP_PAD + LANE*(TRACKS.length-1);
    if (needed > W){
      TRACKS.forEach((t, i) => {
        texts[i*2].ax = 52;  texts[i*2].ay = base2 + 36 + i*24;
        texts[i*2+1].ax = 0; texts[i*2+1].ay = base2 + 36 + i*24;
      });
    } else {
      const n = names.length;
      names[n-1].ax = Math.min(names[n-1].ax, W - names[n-1].wpx);
      for (let i = n-2; i >= 0; i--)
        names[i].ax = Math.min(names[i].ax, names[i+1].ax - 26 - names[i].wpx);
      names[0].ax = Math.max(0, names[0].ax);
      for (let i = 1; i < n; i++)
        names[i].ax = Math.max(names[i].ax, names[i-1].ax + names[i-1].wpx + 26);
      TRACKS.forEach((t, i) => { texts[i*2+1].ax = texts[i*2].ax; });
    }
    apply(cur);
  }

  /* ---------- the drive: a time head draws the lines; the camera rides the tip ---------- */
  const P_DRAW = [0.00, 0.84];                    // head travels 2004 -> past today
  const P_WIDE = [0.84, 1.00];                    // then the pull-back
  const zoomAt = p => {                            // camera zoom over scroll
    const K = [[0,4.2],[0.15,3.8],[0.35,3.0],[0.55,2.6],[0.75,2.05],[0.84,1.8],[1,1]];
    for (let i = 0; i < K.length-1; i++)
      if (p <= K[i+1][0]) return Math.exp(lerp(Math.log(K[i][1]), Math.log(K[i+1][1]), smooth((p-K[i][0])/(K[i+1][0]-K[i][0]))));
    return 1;
  };

  function tipOf(pt, tip){                         // world y of a track's drawing tip
    if (tip <= pt.x0) return { x:pt.x0, y:pt.rise ? pt.yFrom : pt.yLane };
    if (pt.rise && tip < pt.x0 + pt.rise)
      return { x:tip, y: lerp(pt.yFrom, pt.yLane, smooth((tip - pt.x0)/pt.rise)) };
    return { x:tip, y:pt.yLane };
  }

  function apply(p){
    if (!cam || !parts.length) return;
    const drawT = ss(P_DRAW[0], P_DRAW[1], p);
    const headEnd = W * 1.30 + GAP * 3;
    const head = lerp(parts[0].x0, headEnd, drawT);

    let frontier = { x: parts[0].x0, y: parts[0].yLane }, lead = 0;
    const bornFlags = [];
    parts.forEach((pt, i) => {
      const tip = clamp(head - i*GAP, pt.x0, W*1.30);
      const born = tip > pt.x0 + 1;
      pt.clipRect.setAttribute("width", born ? Math.max(0, tip - pt.x0) : 0);
      pt.tailEl.setAttribute("opacity", ss(W - 2, W + 60, tip));
      if (born){ lead = i; frontier = tipOf(pt, Math.min(tip, W)); }
      bornFlags[i] = born;
    });

    /* camera: follow the newest tip, hand off to the wide shot at the end */
    const z0 = zoomAt(p);
    const wide = ss(P_WIDE[0], P_WIDE[1], p);

    /* past years' texts step aside while riding; the full legend returns at the end */
    const showAll = wide > 0.15;
    TRACKS.forEach((t, i) => {
      texts[i*2].el.classList.toggle("on", bornFlags[i] && (showAll || i === lead));
      texts[i*2+1].el.classList.toggle("on", bornFlags[i] && showAll);
    });
    const z = Math.exp(lerp(Math.log(z0), 0, wide));           // -> zoom 1
    const fx = frontier.x - (W/(2*z0)) * 0.22;                 // tip rides ~60% across screen
    const cx = lerp(fx, W/2, wide);
    const cy = lerp(frontier.y, H/2, wide);
    const r = svg.getBoundingClientRect();
    const anchorY = lerp(innerHeight/2 - r.top, H/2, wide);
    cam.setAttribute("transform", `translate(${W/2 - z*cx} ${anchorY - z*cy}) scale(${z})`);

    /* text stays UI-sized: counter-scale each label around its anchor.
       track labels slide along their lane (map-style) while immersed,
       and settle back onto their design position at the wide shot. */
    const inv = 1/z;
    const camLeft = cx - (W/2)/z, camRight = cx + (W/2)/z;
    const camBot = (innerHeight - r.top - anchorY)/z + cy;    // world y at the viewport bottom
    texts.forEach((t, k) => {
      let ax = t.ax;
      if (k % 2 === 0)                                        // names slide; years stay on their moment
        ax = lerp(Math.min(Math.max(t.ax, camLeft + 28/z), camRight - (t.wpx + 28)/z), t.ax, wide);
      const ay = lerp(camBot - (k % 2 === 0 ? 28 : 50)/z, t.ay, wide);
      t.g.setAttribute("transform", `translate(${ax} ${ay}) scale(${inv})`);
    });

    /* the year ticks by as you travel: ’04 ’05 ’06 … up to today */
    if (tickEl){
      const yrNow = Math.min(2026, Math.floor(T0 + (frontier.x / W) * (T1 - T0)));
      tickEl.textContent = "’" + String(yrNow).slice(2);
      tickEl.setAttribute("fill", TRACKS[lead].color);
      tickG.setAttribute("opacity", 1 - wide);
      tickG.setAttribute("transform", `translate(${camLeft + 28/z} ${camBot - 64/z}) scale(${inv})`);
    }

    const h = ss(0.88, 0.98, p);
    hdr.style.opacity = h; rule.style.opacity = h;
    hdr.style.transform = `translateY(${(1-h)*14}px)`;
  }

  /* ---------- loop ---------- */
  let cur = FORCE ?? (HOME ? 1 : 0), target = 0;
  function targetP(){
    if (FORCE !== null) return FORCE;
    if (HOME) return 1;
    const z = document.getElementById("scrollzone");
    const zr = z.getBoundingClientRect();
    const runway = z.offsetHeight - innerHeight;
    return clamp(-zr.top / runway, 0, 1);
  }
  function loop(){
    if (graph.clientWidth !== W && graph.clientWidth > 0) build();
    target = targetP();
    cur += (target - cur) * 0.085;
    if (Math.abs(target - cur) < 0.0004) cur = target;
    apply(cur);
    requestAnimationFrame(loop);
  }

  build();
  addEventListener("resize", build);
  document.fonts.ready.then(build);
  document.fonts.addEventListener("loadingdone", build);
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
